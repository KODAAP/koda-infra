site_name: Koda Documentation
site_description: Plateforme de gestion d'enquêtes ODK — Documentation officielle
site_author: Ekue
site_url: https://sycosur.insuco.net/docs

repo_name: Kodaap
docs_dir: docs

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: fr
  - mkdocstrings:
      handlers:
        python:
          paths: [backend]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Tutoriels:
    - Installation locale: tutorials/getting-started.md
    - Première enquête: tutorials/first-survey.md
    - Premiers exports: tutorials/first-export.md
  - Guides pratiques:
    - Déployer en production: how-to/deploy-production.md
    - Gérer les utilisateurs: how-to/manage-users.md
    - Exporter les données: how-to/export-data.md
    - Configurer Enketo: how-to/configure-enketo.md
    - Gérer les permissions: how-to/manage-permissions.md
  - Référence:
    - Architecture: reference/architecture.md
    - Variables d'environnement: reference/environment-variables.md
    - API REST: reference/api.md
    - Changelog:
      - V2026.05: reference/changelog/V2026.05.md
      - V2026.04: reference/changelog/V2026.04.md
      - V2026.03: reference/changelog/V2026.03.md
  - Explications:
    - Intégration ODK Central: explanation/odk-integration.md
    - Exports asynchrones (Celery): explanation/async-exports.md
    - Stratégie SIG: explanation/gis-strategy.md
    - Gestion des rôles: explanation/roles-permissions.md
