services:
  api: &api
    build:
      context: .
      dockerfile: ./docker/prod/django/Dockerfile
    image: sycosur_api
    container_name: sycosur_api
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    env_file:
      - ./backend/.envs/.env.prod
    depends_on:
      - postgres
      - redis
    command: /start
    networks:
      - reverseProxy_nw

  postgres:
    build:
      context: .
      dockerfile: ./docker/prod/postgres/Dockerfile
    image: sycosur_postgres
    container_name: sycosur_postgres
    volumes:
      - sycosur_postgres_data:/var/lib/postgresql/data
    env_file:
      - ./backend/.envs/.env.prod
    networks:
      - reverseProxy_nw

  client:
    build:
      context: .
      dockerfile: ./docker/prod/client/Dockerfile
    container_name: sycosur_client
    image: sycosur_client
    env_file:
      - "./client/.env.prod"
    networks:
      - reverseProxy_nw

  redis:
    image: redis:7.0-alpine3.19
    command: redis-server --appendonly yes
    container_name: sycosur_redis
    volumes:
      - sycosur_redis_data:/data
    networks:
      - reverseProxy_nw

  enketo:
    image: ghcr.io/enketo/enketo:7.6.1
    container_name: sycosur_enketo
    expose:
       - "8005"
    volumes:
       - ./docker/prod/enketo/config.json:/srv/src/enketo/packages/enketo-express/config/config.json
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - reverseProxy_nw

  celeryworker:
    <<: *api
    image: sycosur_celeryworker
    container_name: sycosur_celeryworker
    command: /start-celeryworker

#  celerybeat:
#    image: sycosur_celerybeat
#    container_name: sycosur_celerybeat
#    build:
#      context: .
#      dockerfile: ./docker/prod/django/Dockerfile
#    command: /start-celerybeat
#    volumes:
#      - static_volume:/app/staticfiles
#    env_file:
#      - ./backend/.envs/.env.prod
#    depends_on:
#      - redis
#      - postgres
#    networks:
#      - reverseProxy_nw

  flower:
    <<: *api
    image: sycosur_flower
    container_name: sycosur_flower
    ports:
      - "5555:5555"
    command: /start-flower


networks:
    reverseProxy_nw:
        external: true

volumes:
  media_volume:
  static_volume:
  sycosur_postgres_data:
  sycosur_redis_data:
