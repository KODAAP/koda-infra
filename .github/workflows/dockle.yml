name: Dockle Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dockle:
    name: Dockle Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            file: ./docker/prod/django/Dockerfile
            image: koda-api
          - name: frontend
            file: ./docker/prod/client/Dockerfile
            image: koda-client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Build Docker image
        run: |
          docker build -f ${{ matrix.file }} -t ${{ matrix.image }}:${{ github.sha }} .

      - name: Run Dockle
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            goodwithtech/dockle:v0.4.15 \
            --exit-code 0 \
            --format sarif \
            --no-extensions \
            -o /workspace/dockle-results-${{ matrix.name }}.sarif \
            ${{ matrix.image }}:${{ github.sha }}

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3.28.11
        with:
          sarif_file: dockle-results-${{ matrix.name }}.sarif
          category: dockle-${{ matrix.name }}