name: CD — Livraison Continue

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'docs/**'
  # Permettre de relancer un build manuellement
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout koda-infra avec submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées image Backend
        id: meta-backend
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/koda-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Métadonnées image Frontend
        id: meta-frontend
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/koda-client
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build & Push image Backend
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671 # v5.0.0
        with:
          context: .
          file: ./docker/prod/django/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push image Frontend
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671 # v5.0.0
        with:
          context: .
          file: ./docker/prod/client/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_DOMAIN=${{ secrets.NEXT_PUBLIC_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Scan de sécurité des images poussées
  dockle-scan:
    name: Dockle Scan (${{ matrix.name }})
    needs: build-push-docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: read          
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/${{ github.repository_owner }}/koda-api
          - name: frontend
            image: ghcr.io/${{ github.repository_owner }}/koda-client
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Scan Docker image
        run: |
          # 1. Forcer le nom de l'image en minuscules
          IMAGE_NAME=$(echo "${{ matrix.image }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ needs.build-push-docker.outputs.image_tag }}"
          
          # 2. Pull de l'image
          echo "Pulling $IMAGE_NAME:$IMAGE_TAG"
          docker pull "$IMAGE_NAME:$IMAGE_TAG"
          
          # 3. Run Dockle
          echo "Running Dockle..."
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            goodwithtech/dockle:v0.4.15 \
            --exit-code 0 \
            --format sarif \
            -o /workspace/dockle-results-${{ matrix.name }}.sarif \
            "$IMAGE_NAME:$IMAGE_TAG"

      - name: Upload SARIF
        if: always() && hashFiles('dockle-results-${{ matrix.name }}.sarif') != ''
        uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        with:
          sarif_file: dockle-results-${{ matrix.name }}.sarif
          category: dockle-${{ matrix.name }}
          github-token: ${{ secrets.GH_PAT }}

  deploy:
    name: Deploy to VM via SSH
    runs-on: ubuntu-24.04
    needs: build-push-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Copy prod.yml to VM
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_KEY }}
          source: "prod.yml"
          target: ${{ secrets.DEPLOY_PATH || '/home/ubuntu/koda-infra' }}

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/ubuntu/koda-infra' }}
          IMAGE_TAG: ${{ needs.build-push-docker.outputs.image_tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_PULL_TOKEN,GITHUB_ACTOR,DEPLOY_PATH,IMAGE_TAG
          script: |
            set -e
            cd "$DEPLOY_PATH"

            # 1. Login sur GHCR
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # 2. Exporter le tag d'image pour docker compose
            export IMAGE_TAG="$IMAGE_TAG"

            # 3. Pull des nouvelles images
            docker compose -f prod.yml pull

            # 4. Redemarrage avec nouvelles images
            docker compose -f prod.yml up -d --remove-orphans

            # 5. Migrations de base de donnees Django
            docker compose -f prod.yml exec -T api python manage.py migrate --noinput

            # 6. Collecte des fichiers statiques
            docker compose -f prod.yml exec -T api python manage.py collectstatic --noinput

            # 7. Nettoyage des anciennes images inutilisees
            docker image prune -af --filter "until=168h"