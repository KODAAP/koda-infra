name: CD — Livraison Continue

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'docs/**'
  # Permettre de relancer un build manuellement
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout koda-infra avec submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées image Backend
        id: meta-backend
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/koda-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Métadonnées image Frontend
        id: meta-frontend
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/koda-client
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build & Push image Backend
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: ./docker/prod/django/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push image Frontend
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: ./docker/prod/client/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_DOMAIN=${{ secrets.NEXT_PUBLIC_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Scan de sécurité des images poussées
  dockle-scan:
    name: Dockle Scan (${{ matrix.name }})
    needs: build-push-docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: read          
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/${{ github.repository_owner }}/koda-api
          - name: frontend
            image: ghcr.io/${{ github.repository_owner }}/koda-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Scan Docker image
        run: |
          # 1. Forcer le nom de l'image en minuscules
          IMAGE_NAME=$(echo "${{ matrix.image }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ needs.build-push-docker.outputs.image_tag }}"
          
          # 2. Pull de l'image
          echo "Pulling $IMAGE_NAME:$IMAGE_TAG"
          docker pull "$IMAGE_NAME:$IMAGE_TAG"
          
          # 3. Run Dockle
          echo "Running Dockle..."
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            goodwithtech/dockle:v0.4.15 \
            --exit-code 0 \
            --format sarif \
            -o /workspace/dockle-results-${{ matrix.name }}.sarif \
            "$IMAGE_NAME:$IMAGE_TAG"

      - name: Upload SARIF as Artifact
        if: always() && hashFiles(format('dockle-results-{0}.sarif', matrix.name)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: dockle-results-${{ matrix.name }}
          path: dockle-results-${{ matrix.name }}.sarif
          retention-days: 14 # Garde le fichier pendant 14 jours

