upstream api {
  server api:8001;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
map $upstream_status $auth_header {
  401 'Basic realm="ODK Central"';
  default "";
}
upstream client {
  server client:3000;
}

# upstream enketo { (désactivé)
#   server enketo:8005;
# }

server {
  listen 80;

  client_max_body_size 20M;

  error_log /var/log/nginx/error.log error;

  proxy_set_header Host $host;

  proxy_set_header X-Real-IP $remote_addr;

  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_http_version 1.1;

  proxy_set_header Upgrade $http_upgrade;

  proxy_set_header Connection $connection_upgrade;

  location /api/v1/ {
    proxy_pass http://api;
    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log error;
  }

  location /secret {
    proxy_pass http://api;
    access_log /var/log/nginx/admin_access.log;
  }

  location /redoc {
    proxy_pass http://api;
  }

  location /api/v1/auth/google {
    proxy_pass http://client/google;
  }

  # location /-/ { (enketo désactivé)
  #   proxy_pass http://enketo;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-OpenRosa-Version '1.0';
  #   proxy_set_header X-OpenRosa-Headers 'HTTP_X_FORWARDED_FOR';
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   add_header WWW-Authenticate $auth_header always;
  # }

# Routes secondaires pour Enketo (désactivées)
  # location ~ ^/(transform|submission|webform|launch|api/v2) {
  #   proxy_pass http://enketo;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   add_header WWW-Authenticate $auth_header always;
  # }

  location / {
    proxy_pass http://client;
  }

  location /static/ {
    alias /app/staticfiles/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location /media/ {
    alias /app/media/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }
}

server {
  listen 9090;

  # Support both root / and /docs/ paths
  location /docs/ {
    alias /app/site/;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location / {
    alias /app/site/;
    index index.html;
    try_files $uri $uri/ =404;
  }
}
